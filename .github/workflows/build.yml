name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

permissions:
  contents: write

jobs:
  build:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v5.11.2
          target: Win64

      - name: Upload .geode file
        uses: actions/upload-artifact@v4
        with:
          name: hack-menu
          path: ${{ steps.build.outputs.build-output }}/*.geode

      # Keeps one rolling "latest-build" release up to date with main, so
      # installer/install.ps1 always has a .geode file to download.
      - name: Publish latest build
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # The build output is a Windows path, so this step uses PowerShell
          # (bash would eat the backslashes).
          gh release delete latest-build --yes --cleanup-tag 2>$null
          $files = Get-ChildItem -LiteralPath "${{ steps.build.outputs.build-output }}" -Filter *.geode |
            ForEach-Object FullName
          gh release create latest-build @files `
            --title "Latest build" `
            --notes "Built automatically from ${{ github.sha }}." `
            --target ${{ github.sha }}
