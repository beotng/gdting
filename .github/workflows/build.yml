name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

permissions:
  contents: write

jobs:
  build:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v5.11.2
          target: Win64

      - name: Upload .geode file
        uses: actions/upload-artifact@v4
        with:
          name: hack-menu
          path: ${{ steps.build.outputs.build-output }}/*.geode

      # Keeps one rolling "latest-build" release up to date with main, so
      # installer/install.ps1 always has a .geode file to download. The build
      # output is a Windows path, so copy the file somewhere relative first.
      - name: Collect .geode for release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item -Path (Join-Path "${{ steps.build.outputs.build-output }}" "*.geode") -Destination release

      - name: Publish latest build
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest build
          body: Built automatically from ${{ github.sha }}.
          files: release/*.geode
          fail_on_unmatched_files: true
